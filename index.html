<style>
  :root{
    --indigo:#22274d; --coral:#e9745c; --gold:#f7b76e;
    --ink:#f4ede2; --ink-soft:#cbc4d6;
    --card:rgba(255,255,255,0.06); --card-line:rgba(255,255,255,0.12);
    --alert:#f2a65a; --alert-bg:rgba(242,166,90,0.14);
    --ok:#8fce9b; --muted:#a7a3b8; --jp:#f2a0a0; --cook:#f7c56e; --garden:#9fd6a0;
    --safe-top:env(safe-area-inset-top); --safe-bot:env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(120% 60% at 50% -8%, rgba(247,183,110,.28), transparent 60%),
      linear-gradient(180deg,#22274d 0%, #3a3358 42%, #6a4b5f 72%, #7a3f42 100%);
    background-attachment:fixed; min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  header{padding:calc(var(--safe-top) + 20px) 22px 12px;display:flex;align-items:center;gap:13px}
  header img{width:44px;height:44px;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
  header .h-txt{display:flex;flex-direction:column;line-height:1.15}
  header h1{font-size:20px;margin:0;font-weight:650;letter-spacing:.2px}
  header .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  main{flex:1;padding:4px 16px 120px;overflow-y:auto}
  .view{display:none;animation:fade .3s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .daterow{display:flex;justify-content:space-between;align-items:baseline;padding:8px 6px 2px}
  .daterow .d{font-size:15px;font-weight:600}
  .daterow .g{font-size:12px;color:var(--muted)}
  .theme{font-size:13px;color:var(--gold);font-weight:600;padding:2px 6px 10px}
  .lede{font-size:14.5px;line-height:1.5;color:var(--ink-soft);padding:0 6px 14px;opacity:.95}

  /* Section cards */
  .sections{display:flex;flex-direction:column;gap:10px;padding:2px 6px 8px}
  .sec-card{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    font-family:inherit;cursor:pointer;color:var(--ink);padding:13px 15px;border-radius:18px;
    background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
    border:1px solid var(--card-line);box-shadow:0 6px 20px rgba(0,0,0,.20);
    transition:transform .1s ease, box-shadow .2s ease}
  .sec-card:active{transform:scale(.985)}
  .sec-card::before{content:"";position:absolute;inset:0;opacity:.16;pointer-events:none}
  .sec-card.jp::before{background:radial-gradient(130% 150% at 0% 0%,rgba(242,160,160,.55),transparent 55%)}
  .sec-card.cook::before{background:radial-gradient(130% 150% at 0% 0%,rgba(247,197,110,.5),transparent 55%)}
  .sec-card.garden::before{background:radial-gradient(130% 150% at 0% 0%,rgba(159,214,160,.5),transparent 55%)}
  .sec-ic{position:relative;z-index:1;flex:0 0 46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:23px}
  .sec-card.jp .sec-ic{background:linear-gradient(135deg,rgba(242,160,160,.4),rgba(242,160,160,.12));border:1px solid rgba(242,160,160,.5);box-shadow:0 3px 14px rgba(242,160,160,.3)}
  .sec-card.cook .sec-ic{background:linear-gradient(135deg,rgba(247,197,110,.4),rgba(247,197,110,.12));border:1px solid rgba(247,197,110,.5);box-shadow:0 3px 14px rgba(247,197,110,.3)}
  .sec-card.garden .sec-ic{background:linear-gradient(135deg,rgba(159,214,160,.4),rgba(159,214,160,.12));border:1px solid rgba(159,214,160,.5);box-shadow:0 3px 14px rgba(159,214,160,.3)}
  .sec-txt{position:relative;z-index:1;display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
  .sec-name{font-size:15.5px;font-weight:650;letter-spacing:.2px}
  .sec-card.jp .sec-name{color:var(--jp)} .sec-card.cook .sec-name{color:var(--cook)} .sec-card.garden .sec-name{color:var(--garden)}
  .sec-prev{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sec-arrow{position:relative;z-index:1;flex:0 0 auto;font-size:24px;color:var(--muted);opacity:.55;font-weight:300}

  .section-h{display:flex;align-items:center;gap:8px;margin:16px 6px 10px;font-size:12px;
    text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);font-weight:700}
  .section-h::after{content:"";flex:1;height:1px;background:var(--card-line)}

  .card{background:var(--card);border:1px solid var(--card-line);border-radius:16px;
    padding:14px 15px;margin-bottom:11px;backdrop-filter:blur(8px)}
  .card.alert{border-color:rgba(242,166,90,.45);background:var(--alert-bg)}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
    padding:3px 9px;border-radius:999px;margin-bottom:8px;background:rgba(255,255,255,.12);color:var(--ink)}
  .card.alert .tag{background:rgba(242,166,90,.28);color:#ffe6c4}
  .card h3{margin:0 0 5px;font-size:15.5px;font-weight:640;line-height:1.3}
  .card p{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink-soft)}

  .tl-list .row{display:flex;gap:13px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07)}
  .tl-list .row:last-child{border-bottom:0}
  .tl-list .t{flex:0 0 66px;font-size:12.5px;font-weight:700;color:var(--gold);padding-top:1px}
  .tl-list .body .ti{font-size:14.5px;font-weight:600;margin-bottom:2px}
  .tl-list .body .de{font-size:12.5px;color:var(--muted)}

  .noise{font-size:12px;color:var(--muted);padding:8px 6px 0;font-style:italic}
  .clear{font-size:12.5px;color:var(--ok);padding:6px 6px 0}
  .resolved ul{margin:0;padding-left:18px}
  .resolved li{font-size:13.5px;color:var(--ink-soft);line-height:1.5;margin-bottom:6px}

  /* Sub-page header with Home button */
  .subhead{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:10px;
    margin:-4px -16px 8px;padding:10px 16px;background:rgba(30,26,48,.72);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--card-line)}
  .backbtn{background:rgba(255,255,255,.1);border:1px solid var(--card-line);color:var(--ink);
    font-family:inherit;font-size:13px;font-weight:600;padding:7px 13px;border-radius:999px;cursor:pointer;
    display:flex;align-items:center;gap:5px}
  .backbtn:active{background:rgba(255,255,255,.2)}
  .subhead .st{font-size:15px;font-weight:650}
  .subhead .accent-jp{color:var(--jp)} .subhead .accent-cook{color:var(--cook)} .subhead .accent-garden{color:var(--garden)}

  /* Japanese */
  .jp-hero{font-size:13px;color:var(--jp);font-weight:600;padding:2px 6px 4px}
  .jp-rule{margin-bottom:10px}
  .jp-rule .lab{font-size:13px;font-weight:700;color:var(--ink)}
  .jp-rule .det{font-size:12.5px;color:var(--muted);margin:2px 0 6px}
  .jp-rule ul{margin:0;padding-left:18px}
  .jp-rule li{font-size:14px;line-height:1.7;color:var(--ink-soft)}
  .jp-big{border-left:4px solid var(--jp);padding:10px 14px;background:rgba(242,160,160,.1);
    border-radius:4px;font-size:13.5px;line-height:1.5;margin:6px 0 4px}
  .vocab .v{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07)}
  .vocab .v:last-child{border-bottom:0}
  .vocab .vj{font-size:15px;font-weight:600}
  .vocab .vr{font-size:11px;color:var(--muted)}
  .vocab .ve{font-size:12.5px;color:var(--ink-soft);text-align:right;flex:0 0 42%}
  .ex{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07)}
  .ex:last-child{border-bottom:0}
  .ex .j{font-size:15.5px;font-weight:600;line-height:1.5}
  .ex .r{font-size:11.5px;color:var(--muted);margin:2px 0}
  .ex .e{font-size:13px;color:var(--ink-soft)}
  .reveal{margin-top:8px}
  .reveal button{background:rgba(242,160,160,.18);border:1px solid rgba(242,160,160,.4);color:#ffd9d9;
    font-family:inherit;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer}
  .reveal .ans{display:none;margin-top:10px;font-size:14px;line-height:1.5;color:var(--ink-soft)}
  .reveal.open .ans{display:block}

  /* Cooking */
  .cook-steps{margin:6px 0 0;padding-left:20px}
  .cook-steps li{font-size:13px;line-height:1.55;color:var(--ink-soft);margin-bottom:3px}
  .pill{font-size:11px;color:var(--cook);font-weight:600}
  .ing{font-size:12.5px;color:var(--muted);margin:3px 0 0;line-height:1.45}
  .shop .s{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07)}
  .shop .s:last-child{border-bottom:0}
  .shop .sec{font-size:12px;font-weight:700;color:var(--cook);text-transform:uppercase;letter-spacing:.5px}
  .shop .it{font-size:13px;color:var(--ink-soft);margin-top:2px;line-height:1.45}

  .arch-card{background:var(--card);border:1px solid var(--card-line);border-radius:16px;padding:14px 15px;margin-bottom:11px}
  .arch-card .kind{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--gold)}
  .arch-card .lbl{font-size:12px;color:var(--muted);float:right}
  .arch-card p{margin:6px 0 0;font-size:13px;line-height:1.5;color:var(--ink-soft)}
  .arch-card.link{cursor:pointer} .arch-card.link:active{border-color:var(--gold)}
  .arch-note,.foot{font-size:11.5px;color:var(--muted);text-align:center;padding:16px 20px;line-height:1.5}

  nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:var(--safe-bot);
    background:linear-gradient(180deg, rgba(30,26,48,.6), rgba(24,20,40,.92));
    backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,.1)}
  nav .inner{max-width:640px;margin:0 auto;display:flex}
  nav button{flex:1;background:none;border:0;color:var(--muted);font-family:inherit;padding:11px 0 12px;
    font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
  nav button.active{color:var(--ink)}
  nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7}
  nav button.active svg{stroke:var(--gold)}
</style>
</head>

function showTab(which){

async function boot(){

  let live=false, stamp='';

    fetch(url,{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j){DATA[k]=j;live=true;if(k==='today'&&j.generatedAt)stamp=j.generatedAt;}}).catch(()=>{})
  ));
  renderAll();
  document.getElementById('statusline').textContent = live ? ('Live · '+(stamp||'updated today')) : 'Snapshot (not hosted yet)';
}
